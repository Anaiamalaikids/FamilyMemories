name: Sunday Secret Santa Reminder

on:
  schedule:
    # Runs every Sunday at 04:30 UTC (10:00 AM Indian Standard Time)
    - cron: '30 4 * * 0'
  workflow_dispatch: # Allows manual run anytime from GitHub Actions tab

jobs:
  send-reminder:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run Sunday Reminder Script
        run: node scripts/send_sunday_reminder.js
